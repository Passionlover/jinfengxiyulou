<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金風細雨樓</title>
<style>
  :root {
    --bg: #1c1a17;
    --panel: #2a2622;
    --panel-2: #332e28;
    --border: #4a4238;
    --text: #eee6d8;
    --text-dim: #b3a894;
    --accent: #c9a24b;
    --accent-2: #7fae6b;
    --danger: #b5573f;
    --card-bg: #211e1a;
    /* 戰鬥字串顏色比照1.0現行配色（見game_systems.md「身分色蓋過招式色」＋09-08 STATUS_COLOR改版）：
       身分色套用在人名／招式名／武器名，我方一律青色；敵方依邪惡/一般兩級分類；傷害與異常狀態
       同色；會心依攻擊方是我方或敵方分兩種同色系藍。 */
    --id-player: #5ad6d6;
    --id-evil: #ff6fc4;
    --id-general: #e0c341;
    --dmg: #ff5c5c;
    --crit-player: #4aa8ff;
    --crit-mob: #2f6fbf;
    --lvlup: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    color: var(--text);
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  /* ---- top bar ---- */
  #topbar {
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    flex-shrink: 0;
  }
  #topbar .brand { color: var(--text-dim); font-size: 12px; }
  #topbar .res { display: flex; gap: 10px; }
  #topbar .res span.label { color: var(--text-dim); margin-right: 2px; }
  #topbar .rp-val { color: var(--accent-2); font-weight: bold; }
  #topbar .gp-val { color: var(--accent); font-weight: bold; }

  /* ---- notice bar (story banner) ---- */
  #noticebar {
    background: #171512;
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  #noticebar .quote { color: var(--text); }

  /* ---- content ---- */
  #content {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px 90px 12px;
    -webkit-overflow-scrolling: touch;
  }

  .screen-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 12px 0;
  }
  .screen-title .tag {
    background: var(--accent);
    color: #201a10;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: bold;
  }
  .screen-title h1 {
    font-size: 17px;
    margin: 0;
    font-weight: bold;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .card.clickable { cursor: pointer; }
  .card.clickable:active { background: #262219; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

  /* 角色畫像預留位（玩家分身除外），先佔位不放實際圖檔 */
  .card-row { display: flex; gap: 10px; align-items: flex-start; }
  .card-row .card-main { flex: 1; min-width: 0; }
  .portrait-slot {
    width: 128px; height: 128px; flex-shrink: 0;
    border: 1px dashed var(--border);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 11px; line-height: 1.3; text-align: center;
    background: var(--panel-2);
  }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .card-head .name { font-size: 15px; font-weight: bold; color: var(--text); }
  .card-head .arrow { color: var(--text-dim); font-size: 16px; }
  .card-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.6; margin-bottom: 8px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px 10px;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .stat-grid .stat-item { display: flex; justify-content: space-between; }
  .stat-grid .stat-item .k { color: var(--text-dim); }
  .stat-grid .stat-item .v { color: var(--text); font-weight: bold; }

  .btn {
    display: inline-block;
    background: var(--accent);
    color: #201a10;
    font-weight: bold;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 6px;
    text-align: center;
    border: none;
    width: 100%;
    cursor: pointer;
  }
  .btn:active { background: #b3903f; }
  .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:active { background: #3a352d; }
  .btn.danger { background: var(--danger); color: #fff0ec; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .warn-box {
    background: #2f2418;
    border: 1px solid #6a4a1f;
    color: #e8c98a;
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  /* .ok-box一直有在用但先前沒有對應的CSS規則（2026-09-24補上），跟warn-box同一套版型，
     改用accent-2(綠)配色代表正向訊息。 */
  .ok-box {
    background: #1c2c1e;
    border: 1px solid #3d6a44;
    color: var(--accent-2);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  /* 特殊事件高亮框（2026-09-24新增，jun要求觸發式事件如秦夕加入要在任務完成畫面明顯
     標示）：用accent金色打底、深色文字加粗，跟ok-box/warn-box的低調配色明顯不同，
     一眼就能看出「這則不是普通的委託結算文字」。 */
  .event-box {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #201a10;
    font-size: 13px;
    font-weight: bold;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .section-label {
    font-size: 12px;
    color: var(--text-dim);
    margin: 14px 0 6px 2px;
    letter-spacing: 1px;
  }

  .row-between { display: flex; justify-content: space-between; align-items: center; }

  .log-entry {
    border-bottom: 1px solid var(--border);
    padding: 8px 0;
    font-size: 12.5px;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .log-time { color: var(--text-dim); font-size: 11px; }
  .log-entry .log-loc { color: var(--accent); font-weight: bold; }
  .log-entry .log-result-win { color: var(--accent-2); }
  .log-entry .log-result-lose { color: var(--danger); }
  .log-entry .log-detail { color: var(--text-dim); margin-top: 3px; }

  .empty-hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 30px 10px;
  }

  /* ---- bottom nav ---- */
  #navbar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--panel-2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #navbar .nav-item {
    flex: 1;
    text-align: center;
    padding: 9px 0 8px 0;
    font-size: 11.5px;
    color: var(--text-dim);
    cursor: pointer;
    border-top: 2px solid transparent;
  }
  #navbar .nav-item .ico { font-size: 18px; display: block; margin-bottom: 2px; }
  #navbar .nav-item.active { color: var(--accent); border-top-color: var(--accent); }

  /* ---- character creation full screen ---- */
  .cc-wrap { padding-top: 6px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ---- 九圍分配器 ---- */
  .name-input {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .points-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .points-banner .num { font-size: 20px; font-weight: bold; color: var(--accent); }
  .points-banner .num.zero { color: var(--accent-2); }
  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .stat-name { font-size: 14px; width: 46px; flex-shrink: 0; }
  .stat-row .stat-ctrl { display: flex; align-items: center; gap: 10px; }
  .stat-row .stat-btn {
    width: 30px; height: 30px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .stat-row .stat-btn:disabled { opacity: 0.3; cursor: default; }
  .stat-row .stat-btn:active:not(:disabled) { background: #3a352d; }
  .stat-row .stat-num { width: 26px; text-align: center; font-weight: bold; font-size: 15px; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ---- 動態演出（2026-09-24新增）：戰報頭像列＋一次性強調動畫，刻意輕量、播完自動歸位 ---- */
  .log-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; border-radius: 6px; }
  .log-avatar-wrap { flex-shrink: 0; width: 44px; height: 44px; }
  .log-avatar { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; display: block; }
  .log-avatar-silhouette {
    width: 44px; height: 44px; border-radius: 8px;
    background: rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center;
  }
  .log-avatar-silhouette svg { width: 26px; height: 26px; fill: currentColor; }
  .log-row .log-line { flex: 1; padding-top: 2px; }
  .log-float-dmg, .log-float-heal { display: inline-block; font-weight: 700; margin-left: 4px; }
  .log-float-dmg { color: var(--dmg); }
  .log-float-heal { color: var(--accent-2); }
  .log-row-fresh .log-float-dmg, .log-row-fresh .log-float-heal { animation: logNumPop .35s ease-out; }
  .log-row-fresh.log-row-crit .log-float-dmg { animation: logNumPopBig .45s ease-out; }
  .log-row-fresh.log-row-dodge { animation: logRowShake .3s ease-in-out; }
  .log-row-fresh.log-row-hit { animation: logRowFlash .4s ease-out; }
  @keyframes logNumPop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes logNumPopBig { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.6); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes logRowShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes logRowFlash { 0% { background: rgba(255,92,92,.22); } 100% { background: transparent; } }

  .progress-bar-track { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { height: 100%; background: var(--accent-2); transition: width .6s ease-out; border-radius: 4px; }

  .lvlup-pop { display: inline-block; animation: lvlupGlow .8s ease-out; }
  @keyframes lvlupGlow {
    0% { transform: scale(1); text-shadow: 0 0 0 transparent; }
    40% { transform: scale(1.3); text-shadow: 0 0 8px var(--lvlup); }
    100% { transform: scale(1); text-shadow: 0 0 0 transparent; }
  }

  .num-tween { transition: none; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar" style="display:none;"></div>
  <div id="noticebar" style="display:none;"></div>
  <div id="content"></div>
  <div id="navbar" style="display:none;"></div>
</div>

<script>
"use strict";

/* =========================================================
   資料設定：九圍 / 地點 / 商店
   樓主與玩家分身的資料關係待定案；現行泛用角色依門派模組建立，
   以九圍模組基礎值加 10 點微調，再套用個性。
   ========================================================= */

const STAT_KEYS = ["str", "will", "wis", "cou", "con", "spr", "app", "luk", "agi"];
const STAT_LABELS = {
  str: "臂力", will: "定性", wis: "悟性", cou: "膽識",
  con: "根骨", spr: "靈性", app: "容貌", luk: "福緣", agi: "機敏"
};
const RECRUIT_TOTAL_POINTS = 10;
const RECRUIT_MIN_PER_STAT = 5;
const RECRUIT_MAX_PER_STAT = 20;
const RECRUIT_ROSTER_CAP = 99;
const SQUAD_COUNT = 6;
const SQUAD_CAPACITY = 6;

// 門派決定可選分支；數值順序為臂力／根骨／機敏／膽識／定性／悟性／靈性／容貌／福緣。
// 2026-09-23修正：九圍加總硬性規範是120點（跟玩家的120點分配制同一套規則，沒有例外），
// 之前這13個模組各自介於84~94，沒對齊規範。用等比例放大＋上限20封頂的演算法重新
// 配點，維持各門派原本的數值相對強弱關係（角色特色靠配點比例呈現，不靠總量偷跑），
// 只是整體規模統一拉到120。
const MODULE_DEFS = [
  ["chunyang-sword","純陽劍派","純陽劍法",[20,16,17,14,13,11,10,11,8],"front","入門劍法Lv1","劍","前排輸出：優先攻擊敵方前排"],
  ["chunyang-array","純陽劍派","純陽陣法",[14,13,10,10,19,14,18,12,10],"front","朝陽劍陣Lv1＋劍法(50%)","劍","支援控場：優先維持陣法生效，順帶輸出"],
  ["wuxiang-staff","無相寺","無相棍法",[18,20,11,18,17,10,9,9,8],"front","入門棍法Lv1","棍","坦克型：優先承受攻擊，站前排扛傷"],
  ["wuxiang-fist","無相寺","無相拳術",[20,19,17,17,12,9,9,10,7],"front","入門拳術Lv1","拳套/護手","前排輸出：爆發型，優先攻擊敵方前排"],
  ["tingxue-sword","聽學書院","聽學劍法",[15,12,17,12,13,20,11,11,9],"front","入門劍法Lv1","劍","前排輸出：智性型，優先攻擊威脅最高目標"],
  ["tingxue-dagger","聽學書院","聽學刺術",[15,11,20,12,12,20,11,10,9],"front","入門刺術Lv1","匕首","前排輸出：優先攻擊敵方前排"],
  ["yaowang-medicine","藥王居","藥王醫術",[8,12,10,9,17,20,19,11,14],"back","入門醫術Lv1","藥囊/銀針","醫療型：死亡→起死回生→HP<30%→療傷，無觸發才普攻"],
  ["xueluo-dagger","血羅聖教","血羅刺術",[17,12,20,15,10,12,17,10,7],"front","入門刺術Lv1＋毒術Lv1","匕首","前排輸出：突襲型，優先攻擊敵方前排並附加中毒"],
  ["xueluo-throw","血羅聖教","血羅暗器",[12,11,20,13,11,17,19,10,7],"back","入門暗器Lv1＋毒術Lv1","暗器(飛鏢/袖箭)","後排輸出：無視排位限制，優先攻擊敵方後排並附加中毒"],
  ["pojun-spear","破軍府","破軍槍法",[20,20,13,18,13,10,7,11,8],"front","入門槍法Lv1","槍","前排輸出：重裝突擊，優先攻擊敵方前排"],
  ["pojun-bow","破軍府","破軍弓術",[14,13,20,14,12,18,8,11,10],"back","入門弓術Lv1","弓","後排輸出：無視排位限制，優先鎖定威脅目標"],
  ["pojun-lance","破軍府","破軍槍騎",[20,18,16,20,11,9,7,11,8],"front","入門槍法Lv1＋入門騎術Lv1","槍＋馬具","前排輸出：衝鋒突擊，優先攻擊敵方前排"],
  ["pojun-rider","破軍府","破軍弓騎",[13,15,20,15,11,15,9,11,11],"back","入門弓術Lv1＋入門騎術Lv1","弓＋馬具","後排輸出：機動型，無視排位限制優先鎖定威脅目標"]
].map(([id, sect, name, values, row, skill, equipment, ai]) => ({
  id, sect, name, row, skill, equipment, ai,
  stats: { str: values[0], con: values[1], agi: values[2], cou: values[3], will: values[4], wis: values[5], spr: values[6], app: values[7], luk: values[8] }
}));
const SECTS = [...new Set(MODULE_DEFS.map(m => m.sect))];
// 已由規格定案的武學進階路線；其餘門派待逐一盤點後再開放突破。
const MARTIAL_PATHS = {
  "chunyang-sword": ["初陽劍法", "承陽劍法", "連陽七訣劍法"],
  "chunyang-array": ["朝陽劍陣", "烈陽劍陣", "純陽天罡陣"],
  "wuxiang-staff": ["伏虎棍法", "金剛鎮嶽棍法", "伏魔鎮嶽杵"],
  "wuxiang-fist": ["無相拳", "無心無相訣", "空相滅塵印"],
  "tingxue-sword": ["浩然劍法", "至衡中庸劍訣", "止戈明分劍"],
  "tingxue-dagger": ["點墨筆法", "驚風落雨筆法", "春秋聖賢筆"],
  "yaowang-medicine": ["三陰鎖脈指", "封脈手", "元神鎖命指"],
  "xueluo-dagger": ["紅羅血刃", "血羅噬魂訣", "血羅九千訣"],
  "xueluo-throw": ["血袖針", "血影神針", "血影滅魂針"],
  "pojun-spear": ["軍槍訣", "破軍槍法", "鎮國十三槍"],
  "pojun-lance": ["軍槍訣", "破軍槍法", "鎮國十三槍"],
  "pojun-bow": ["軍弓訣", "破軍弓法", "護國九箭訣"],
  "pojun-rider": ["軍弓訣", "破軍弓法", "護國九箭訣"],
  // 楚流雲（首徒，金風細雨樓專屬夥伴NPC）：入門/上層新設計，秘傳直接接既有的黃沙萬里刀法。
  "chuliuyun-blade": ["風沙刀法", "孤城刀法", "黃沙萬里刀法"]
};
const MARTIAL_TIERS = ["入門", "上層", "秘傳"];
const MODULE_SKILLS = {
  "chunyang-sword":["初陽劍法","納陽訣","逐光身法"], "chunyang-array":["朝陽劍陣","納陽訣","逐光身法"],
  "wuxiang-staff":["伏虎棍法","洗塵明心訣","渡雲身法"], "wuxiang-fist":["無相拳","洗塵明心訣","渡雲身法"],
  "tingxue-sword":["浩然劍法","無聲訣","青雲逐步","禮行步法"], "tingxue-dagger":["點墨筆法","無聲訣","青雲逐步","禮行步法"],
  "yaowang-medicine":["三陰鎖脈指","岐黃養正訣","懸壺身法","攀山點水步","青囊回春針"],

function artAttrBonus(artName, level) {
  const attrs = ART_ATTR_BONUS[artName];
  if (!attrs) return null;
  const lv = Math.max(1, level || 1);
  const bonus = {};
  bonus[attrs[0]] = Math.floor(1 + lv / 10);
  if (attrs[1]) bonus[attrs[1]] = (bonus[attrs[1]] || 0) + Math.floor(1 + lv / 20);
  return bonus;
}

// 一律對齊BASE_SKILLS canonical值，這裡直接顯示combatSkill()實際會用的那一組。
function martialArtReferenceLine(character) {
  const [, attr1, attr2] = combatSkill(character);
  const bonus = artAttrBonus(currentMartialName(character), character.martialLevel || character.level);
  const bonusText = bonus
    ? "｜此招額外加成：" + Object.entries(bonus).map(([key, val]) => STAT_LABELS[key] + "+" + val).join("、")
    : "";
  return el("div", { class:"card-desc" }, ["武學參照屬性：" + STAT_LABELS[attr1] + "＋" + STAT_LABELS[attr2] + bonusText]);
}

// 代表這回合仍用原本的主武學。
function activeSpecialArt(unit) {
  if (unit.isPlayerCharacter && PLAYER_SPECIAL_ARTS_LOCKED) return null; // 暫不開放，即使舊存檔已裝備也不生效
  const art = SPECIAL_ARTS[unit.equippedArt];
  if (!art) return null;
  const weaponType = unit.equipment && unit.equipment["手"] && unit.equipment["手"].weaponType;
  if (weaponType && weaponType !== art.baseSkill) return null;
  return art;
}
// 角色會的基礎武學種類（決定能學哪些專屬秘傳）：玩家是金風細雨樓四門攻擊武學，
// 一般角色是自己模組那一門。
function characterBaseSkills(character) {
  if (character.isPlayerCharacter) return Object.keys(BASE_SKILLS); // 玩家視為已學會全部基礎武學
  const skill = MODULE_BASE_SKILL[character.moduleId];
  return skill ? [skill] : [];
}

// 🔴任務系統上線後，這裡要再加一道「是否已從任務取得」的判斷（character.learnedArts）。
function availableSpecialArts(character) {
  if ((character.martialTier || "入門") !== "秘傳") return [];
  const owned = characterBaseSkills(character);
  return Object.keys(SPECIAL_ARTS).filter(name => owned.includes(SPECIAL_ARTS[name].baseSkill));
}
// 角色目前生效中的全部武學（名稱→等級），用來累計屬性加成。
function activeArtLevels(unit) {
  const out = {};
  const mainLevel = unit.martialLevel || unit.level || 1;
  const special = activeSpecialArt(unit);
  if (unit.isPlayerCharacter) {
    // 玩家六門常駐同時裝備；若裝備了專屬秘傳，取代同一條基礎武學線的那一門
    // 專屬秘傳若屬於金風細雨樓六門以外的基礎武學線（例如鞭法），沒有可取代的六門武學
    const replaced = special && LORD_ARTS[special.baseSkill] ? LORD_ARTS[special.baseSkill].name : null;
    LORD_ARTS_DISPLAY_NAMES.forEach(name => { if (name !== replaced) out[name] = mainLevel; });
    // 神農百草經：西湖特殊事件取得的玩家專屬醫術，疊加在六門武學之上，不佔用、不取代
    // equippedArt（跟情刀刀法那類「取代同一條武器線」的專屬秘傳是完全獨立的機制）。
    if ((unit.learnedArts || []).includes("神農百草經")) out["神農百草經"] = mainLevel;
  } else {
    out[special ? unit.equippedArt : currentMartialName(unit)] = mainLevel;
  }
  if (special) out[unit.equippedArt] = mainLevel;
  (unit.subSkills || []).forEach(sub => { out[sub.name] = sub.level; });
  return out;
}
// 含武學屬性加成的有效九圍；MOB沒有武學加成，直接回傳原始九圍。
function effectiveStats(unit) {
  if (!unit || !unit.stats) return {};
  if (unit.isMob) return unit.stats;
  const out = { ...unit.stats };
  const levels = activeArtLevels(unit);
  Object.keys(levels).forEach(name => {
    const bonus = artAttrBonus(name, levels[name]);
    if (bonus) Object.keys(bonus).forEach(k => { out[k] = (out[k] || 0) + bonus[k]; });
  });
  return out;
}
// 只算加成的部分，供人物詳情頁顯示「基礎值＋加成」用。
function statBonusOnly(unit) {
  const base = unit.stats || {};
  const eff = effectiveStats(unit);
  const diff = {};
  STAT_KEYS.forEach(k => { const d = (eff[k] || 0) - (base[k] || 0); if (d) diff[k] = d; });
  return diff;
}

function portraitFor(name) { return PORTRAIT_CATALOG[name] || null; }
function catalogItem(id) { return EQUIPMENT_CATALOG.find(i => i.id === id) || null; }
// 挑該武器類型裡「非unique、階級最低」的一把當起始/預設武器（unique的通常是專屬神兵）。
function defaultWeaponIdFor(weaponType) {
  const candidates = EQUIPMENT_CATALOG.filter(i => i.slot === "手" && i.weaponType === weaponType && !i.unique);
  if (!candidates.length) return null;
  return candidates.reduce((a, b) => (a.tier <= b.tier ? a : b)).id;
}
function emptyEquipment() { return { "頭":null, "手":null, "身體":null, "足":null, "飾品":null }; }
// 玩家（樓主）手部位可自由裝備金風細雨樓四門攻擊武學對應的武器類型；其他角色鎖死模組單一類型。
function allowedWeaponTypesFor(character) {
  if (character.isPlayerCharacter) return Object.keys(BASE_SKILLS); // 全基礎武學皆會，任何武器都能裝備
  const skill = MODULE_BASE_SKILL[character.moduleId];
  return skill ? [skill] : [];
}
function ensureCharacterEquipment(character) {
  if (!character.equipment || Array.isArray(character.equipment)) {
    const weaponType = character.isPlayerCharacter ? "daofa" : MODULE_BASE_SKILL[character.moduleId];
    const weaponId = defaultWeaponIdFor(weaponType);
    character.equipment = emptyEquipment();
    if (weaponId) character.equipment["手"] = { ...catalogItem(weaponId) };
  }
}
/* =========================================================
   戰利品掉落與庫房（2026-09-23改為1.0真實MOB掉落表串接）
   - 每隻MOB的loot清單直接來自1.0 npc_data.json的真實掉落設定（各項獨立骰機率）
   - 掉落物一律先進 expedition.pendingLoot，跑滿地點progress點數才入庫；撤退/全滅不帶回（既有規則）
   - 背包分兩類：equipment（可裝備，itemId對到EQUIPMENT_CATALOG）／material（素材，目前僅入庫）
   ========================================================= */
function rollMobLoot(mob, rng) {
  const drops = [];
  (mob.loot || []).forEach(entry => {
    if (rng() * 100 >= entry.chance) return;
    const item = EQUIPMENT_CATALOG.find(i => i.name === entry.name);
    if (item) drops.push({ kind:"equipment", itemId:item.id, name:item.name });
    else drops.push({ kind:"material", name:entry.name });
  });
  return drops;
}
// 舊存檔的背包是純字串陣列（全是素材），統一轉成物件格式
function normalizeInventory() {
  if (!Array.isArray(STATE.inventory)) { STATE.inventory = []; return; }
  STATE.inventory = STATE.inventory.map(e => (typeof e === "string" ? { kind:"material", name:e } : e)).filter(Boolean);
}
function inventoryEquipment() {
  return STATE.inventory.map((entry, index) => ({ entry, index })).filter(x => x.entry && x.entry.kind === "equipment");
}
// 從背包挑一件裝備穿上；原本穿著的那件退回背包（手部位不可空手，所以只換不卸）
function equipFromInventory(character, index) {
  const entry = STATE.inventory[index];
  if (!entry || entry.kind !== "equipment") return;
  const item = catalogItem(entry.itemId); if (!item) return;
  if (item.slot === "手" && !allowedWeaponTypesFor(character).includes(item.weaponType)) return;
  ensureCharacterEquipment(character);
  const previous = character.equipment[item.slot];
  STATE.inventory.splice(index, 1);
  character.equipment[item.slot] = { ...item };
  if (previous && previous.id) STATE.inventory.push({ kind:"equipment", itemId:previous.id, name:previous.name });
  saveState(); render();
}
// 卸下防具退回背包（手部位＝武器不可卸，避免角色沒有攻擊武學可用）
function unequipToInventory(character, slot) {
  if (slot === "手") return;
  ensureCharacterEquipment(character);
  const current = character.equipment[slot];

// 換算：newLevel + (1.0原始武學等級 - 1.0原始等級)，逐項武學獨立換算，差值原樣保留。
function scaleMobSkills(data, newLevel) {
  const out = {};
  Object.entries(data.skills).forEach(([key, value]) => { out[key] = newLevel + (value - data.level); });
  return out;
}
// 人形MOB的主戰武學＝skills裡除了boji（搏擊，備用）／neigong（內功，非戰鬥公式用）以外的那一項；
// 動物MOB只有boji，直接當主戰武學。
function mobPrimarySkillKey(data, skills) {
  if (data.category !== "humanoid") return "boji";
  return Object.keys(skills).find(key => key !== "boji" && key !== "neigong") || "boji";
}
// 人形MOB武器/防具裝備加成＋特殊內功（2026-09-24新增）：查證1.0真實規則
// （mud-test/game_systems.md「人形MOB武器/防具裝備補齊」＋「配套擴大」）發現人形MOB
// 本來就該有武器/防具裝備加成、15級以上還要有特殊內功，4.0先前完全沒做這塊，
// 導致玩家裝備越級成長後MOB攻防完全跟不上（實測：13級以後MOB打玩家幾乎只剩
// 傷害下限1點）。數值曲線不重新發明，直接沿用「階=ceil(等級/5)」（跟裝備掉落
// 規則project_mud_humanoid_mob_equipment_loot同一套）比對4.0自己EQUIPMENT_CATALOG
// 反推校準的實際比例：武器≈階x10、身體防具≈階x6。動物系MOB不受影響（牠們本來就是
// 靠natural_attack/natural_defense頂替裝備維度，這塊沒有問題）。
function mobEquipTier(level) { return Math.max(1, Math.ceil((level || 1) / 5)); }
function mobWeaponAtkBonus(level) { return mobEquipTier(level) * 10; }
// 身體:頭:足＝3:1:1（從EQUIPMENT_CATALOG同階實際裝備反推，例：tier4皮甲def24／
// 皮帽def8／皮靴def8）。2026-09-24補上頭/足兩格（原本只補身體，jun確認後擴大），
// 讓頭目級人形MOB全身防具維度跟頂配玩家看齊，不會打了等於沒打。
function mobArmorDefBonus(level) { return mobEquipTier(level) * 6; }
function mobHeadDefBonus(level) { return mobEquipTier(level) * 2; }
function mobFootDefBonus(level) { return mobEquipTier(level) * 2; }
// 特殊內功（1.0原名「吐納訣」）：15級以上人形MOB才裝備，等級＝基礎內功等級-1。
function mobSpecialNeigongLevel(level, baseNeigong) { return level >= 15 ? Math.max(0, baseNeigong - 1) : 0; }

const ANIMAL_SIGNATURE_SKILL_NAME = {

// 「家傳」版本，不再落到完全沒有招式文字的窘境。10級以下維持原本的通用BASE_SKILLS

const GENERIC_FAMILY_SKILL_NAME = { daofa:"家傳刀法", jianfa:"家傳劍法", gunfa:"家傳棍法", qiangfa:"家傳槍法", gongshu:"家傳弓術", bianfa:"家傳鞭法", cishu:"家傳刺術", dianxue:"家傳點穴", anqi:"家傳暗器", boji:"家傳拳法" };

  if (!data) {
    return { name, level, category:"animal", stats:Object.fromEntries(STAT_KEYS.map(key => [key, Math.min(20, level)])), skills:{boji:level}, combatSkillKey:"boji", martialLevel:level, martialArts:["搏擊格鬥Lv" + level], loot:[] };

  const skills = scaleMobSkills(data, level);

    martialArts:[(signatureName || (BASE_SKILLS[primaryKey] || BASE_SKILLS.boji).label) + "Lv" + martialLevel],

// 隊伍解鎖條件（2026-09-24改版，jun裁定）：不再是「解鎖地點數」這種通用公式，改成每支
// 隊伍各自的具體條件。第1隊永遠可用；第2隊＝黑風嶺（黑風寨）攻略完成後解鎖；第3隊以後
// 條件尚未定案，先維持鎖定，之後jun逐一裁定時再補上對應判斷。
function isSquadUnlocked(squadId) {

const MAX_RP = 100;

/* =========================================================
   狀態管理

let STATE = null;

function freshLordState() {

      dungeonSelectedLocation: null,

    },

    dispatchRefresh: { lastRefresh: 0 },

function migrateV2State(old) {
  const next = freshState();
  next.lord = old.lord || next.lord;
  next.inventory = old.inventory || [];
  next.explorationLog = old.explorationLog || [];
  next.ui.screen = old.ui && old.ui.screen === "story" ? "story" : "main";
  next.ui.tab = old.ui && old.ui.tab ? old.ui.tab : "guild";
  next.roster = (old.roster || []).map(r => ({ ...r, legacyPendingTemplate: true, squadId: null }));
  return next;
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return freshState();
    const parsed = JSON.parse(raw);
    if (!parsed) return freshState();
    if (parsed.version === 3) {
      // 舊存檔（歷練/派遣還是單一個物件，2026-09-24改陣列前）搬進陣列裡；已經是陣列格式的
      // 存檔（新存檔）這裡是no-op。單一物件的舊欄位不再使用，直接丟棄。
      if (!Array.isArray(parsed.expeditions)) parsed.expeditions = parsed.expedition ? [parsed.expedition] : [];
      if (!Array.isArray(parsed.dispatches)) parsed.dispatches = parsed.dispatch ? [parsed.dispatch] : [];
      delete parsed.expedition; delete parsed.dispatch;
      // JSON存檔無法保留rng這種函式閉包；重新整理頁面若剛好卡在戰鬥逐拍進行中，
      // 安全捨棄這場未完成戰鬥（不是資料毀損，下個3秒tick會重新觸發同一個點）。
      parsed.expeditions.forEach(ex => { if (ex.battle && typeof ex.battle.rng !== "function") ex.battle = null; });
      parsed.dispatches.forEach(dp => { if (dp.battle && typeof dp.battle.rng !== "function") dp.battle = null; });
      return parsed;
    }
    if (parsed.version === 2) {
      localStorage.setItem(SAVE_KEY + "_v2_backup", raw);
      return migrateV2State(parsed);
    }
    return freshState();
  } catch (e) {
    console.warn("讀取存檔失敗，開新局", e);
    return freshState();
  }
}

function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(STATE));
  } catch (e) {
    console.warn("存檔失敗", e);
  }
}

/* =========================================================
   RP（樓主／公會共用資源池）
   ========================================================= */

function applyOfflineRecovery(lord) {
  if (!lord) return;
  const now = Date.now();
  const last = lord.rp.lastTimestamp || now;
  const elapsedMinutes = Math.max(0, (now - last) / 60000);
  const regen = Math.floor(elapsedMinutes / RP_REGEN_MINUTES);
  if (regen > 0) {
    lord.rp.current = Math.min(lord.rp.max, lord.rp.current + regen);
    lord.rp.lastTimestamp = last + regen * RP_REGEN_MINUTES * 60000;
  }
}
// 2026-09-24改寫：只跳過「目前正在忙的隊伍」成員，不再因為有任何一支隊伍在外面
// 就整批停止回血——樓主本人不用跟著出動，留守的角色照樣該回滿血。
function recoverRestingCharacters() {
  const busyMemberIds = new Set();
  [...(STATE.expeditions || []), ...(STATE.dispatches || [])].forEach(entry => {
    if (entry.status !== "active") return;
    const squad = STATE.squads.find(s => s.id === entry.squadId);
    if (squad) squad.memberIds.forEach(id => busyMemberIds.add(id));
  });
  (STATE.roster || []).forEach(character => {
    ensureCharacterMartialArts(character);
    if (busyMemberIds.has(character.id)) return;
    character.hp = maxHp(character);
    character.qi = maxQi(character);
  });
}

function spendRP(lord, amount) {
  applyOfflineRecovery(lord);
  if (lord.rp.current < amount) return false;
  lord.rp.current -= amount;
  lord.rp.lastTimestamp = Date.now();
  return true;
}

function minutesUntilNextRP(lord) {
  applyOfflineRecovery(lord);
  if (lord.rp.current >= lord.rp.max) return 0;
  const elapsedSinceLast = (Date.now() - lord.rp.lastTimestamp) / 60000;
  return Math.max(0, Math.ceil(RP_REGEN_MINUTES - elapsedSinceLast));
}

/* =========================================================
   建角（門派分支基礎值＋10點微調；個性於最後套用）
   ========================================================= */

function newRecruitDraft(forPlayer) { return { name: "", forPlayer: Boolean(forPlayer), sect: null, moduleId: null, traitId: null, gender: null, allocated: Object.fromEntries(STAT_KEYS.map(k => [k, 0])) }; }
function getDraftModule(draft) { return MODULE_DEFS.find(m => m.id === draft.moduleId) || null; }
function draftBaseStats(draft) {
  if (draft.forPlayer) return LORD_BASE_STATS;
  const mod = getDraftModule(draft); return mod ? mod.stats : Object.fromEntries(STAT_KEYS.map(k => [k, 0]));
}
function draftStat(draft, key) { return draftBaseStats(draft)[key] + draft.allocated[key]; }
function draftFinalStat(draft, key) { const trait = TRAITS.find(t => t.id === draft.traitId); return draftStat(draft, key) + (trait ? trait.modifiers[key] : 0); }

function draftAllocated(draft) { return STAT_KEYS.reduce((sum, k) => sum + draft.allocated[k], 0); }

function draftRemaining(draft) {
  if (draft.forPlayer) {
    const baseSum = STAT_KEYS.reduce((sum, k) => sum + LORD_BASE_STATS[k], 0); // 9項×5＝45
    return LORD_TOTAL_POINTS - baseSum - draftAllocated(draft); // 120-45=75點可自由分配
  }
  return RECRUIT_TOTAL_POINTS - draftAllocated(draft);
}

function totalPower(stats) {
  // 簡化版戰力公式，僅供這次原型的自動結算使用，非1.0正式戰鬥公式
  return stats.str * 1.1 + stats.con * 1.0 + stats.agi * 1.0 + stats.cou * 0.8 +

}
function createSeededRng(seed) {
  let value = (Number(seed) >>> 0) || 1;

    value = (value * 1664525 + 1013904223) >>> 0;
    return value / 4294967296;
  };
}
function randomInt(rng, min, max) { return min + Math.floor(rng() * (max - min + 1)); }

// 係數13是回推「120小時練到50級」抓出來的估計值，需要實際試跑手感後再微調。
function expToNextLevel(level) { return Math.max(10, Math.round(13 * level * level)); }
// 境界加成（2026-09-23定案）：入門2倍、上層1.5倍、秘傳（含樓主）不加成，
// 讓境界較低的角色能加速追上，不是永久性的數值優勢。
function expTierMultiplier(character) {

  return tier === "入門" ? 2 : tier === "上層" ? 1.5 : 1;
}
function grantExperience(character, amount) {
  character.exp = (character.exp || 0) + amount;

  while (character.level < 100 && character.exp >= expToNextLevel(character.level)) {
    character.exp -= expToNextLevel(character.level);
    character.level++; levels++;
  }
  // 主攻武學隨人物等級同步；副武學則各自依卡級規則同步（見syncSubSkills）。
  character.martialLevel = character.level;
  syncSubSkills(character);
  return levels;
}
function currentMartialName(character) {
  if (activeSpecialArt(character)) return character.equippedArt; // 專屬秘傳取代同一條線的主武學
  if (character.isPlayerCharacter) {
    const weaponType = character.equipment && character.equipment["手"] && character.equipment["手"].weaponType;
    // 沒有對應具名武學的武器類型（例如槍/棍），顯示該基礎武學名稱
    if (weaponType && !LORD_ARTS[weaponType]) return (BASE_SKILLS[weaponType] || {}).label || "拳腳";
    return (LORD_ARTS[weaponType] || LORD_ARTS.daofa).name;
  }
  const path = MARTIAL_PATHS[character.moduleId];

}
function ensureCharacterMartialArts(character) {
  ensureCharacterEquipment(character);
  if (character.isPlayerCharacter) {

    // 舊存檔的玩家境界曾是「上層」，依jun 2026-09-22裁定一律補正為「秘傳」
    character.martialTier = "秘傳"; character.breakthroughs = 2;
    return;
  }
  const expected = MODULE_SKILLS[character.moduleId];
  if (!expected) return;
  const primary = currentMartialName(character);
  const level = character.martialLevel || character.level || 1;
  if (!Array.isArray(character.martialArts) || character.martialArts.length !== expected.length) {
    character.martialArts = [primary + "Lv" + level, ...expected.slice(1).map(name => name + "Lv" + level)];
  }
  // 舊存檔（副武學尚未拆成獨立等級）在此補上subSkills，不影響已有正確結構的角色。
  if (!Array.isArray(character.subSkills) || character.subSkills.length !== expected.length - 1) {

function canBreakthrough(character) {

}
function breakthrough(character) {

  ensureCharacterMartialArts(character);
  // 副武學逐一判斷：鏈上還有下一階就升階歸1繼續同步；沒有下一階就卡住，
  // 維持角色歸1前的等級不動，直到角色等級重新爬過這個數字才恢復同步。
  (character.subSkills || []).forEach(sub => {
    const chain = subSkillChain(sub.name);
    if (sub.tierIndex + 1 < chain.length) {
      sub.tierIndex += 1; sub.name = chain[sub.tierIndex]; sub.level = 1; sub.stuck = false;
    } else {
      sub.stuck = true;
    }
  });
  character.level = 1; character.exp = 0; character.martialLevel = 1;
  character.martialArts[0] = currentMartialName(character) + "Lv1";
  applySubSkillDisplay(character);
  saveState(); render();
}

function randomExpeditionEvents(total = 30, rng = Math.random) {
  const events = [];
  for (let i = 0; i < total; i++) {
    const roll = rng();
    events.push(roll < .5 ? "battle" : roll < .8 ? "quiet" : roll < .9 ? "loot" : "rest");
  }
  return events;
}
function startExpedition(locationId, squadId) {
  const squad = STATE.squads.find(s => s.id === squadId);
  if (!squad || !isSquadUnlocked(squadId) || !squad.memberIds.length || isSquadBusy(squadId)) return;
  const location = LOCATIONS.find(x => x.id === locationId);
  getSquadMembers(squad).forEach(member => {
    member.hp = maxHp(member); member.qi = maxQi(member);
  });
  const seed = Date.now();
  if (!Array.isArray(STATE.expeditions)) STATE.expeditions = [];
  STATE.expeditions.push({ locationId, squadId, seed, progress: 0, battleCount: 0, events: randomExpeditionEvents(locationProgress(location), createSeededRng(seed)), pendingLoot: [], status: "active" });
  saveState(); render();
}
function expeditionLabel(type) { return ({ battle:"遭遇戰鬥", quiet:"無事發生", loot:"發現拾取物", rest:"發現落腳處" })[type] || "未知事件"; }

/* P2 戰鬥原型：以九圍、等級與武學階層推導數值；公式可在數值測試後替換。 */
// 以下九圍一律讀 effectiveStats（原始九圍＋裝備中武學的屬性加成），不直接讀 unit.stats。
function maxHp(unit) { const s = effectiveStats(unit); return unit.isMob ? 28 + s.con * 4 + (unit.level || 1) * 4 : 60 + s.con * 6 + (unit.level || 1) * 8; }
// 1.0真實公式（compute_qi_max，stat_utils.py）：
// 內力上限=(40+4×等級)×(100+悟性+根骨×3+定性)%×(100+(基礎內功等級+特殊內功等級)/2)%

// 內功等級沿用跟攻擊力/防禦力同一套簡化（詳見defenseValue()）：MOB用真實neigong資料
// (特殊固定0)，玩家/夥伴角色皆等同角色等級。
function maxQi(unit) {
  const s = effectiveStats(unit);
  const level = unit.level || 1;
  const levelTerm = 40 + 4 * level;
  const attrPct = (100 + (s.wis || 0) + (s.con || 0) * 3 + (s.will || 0)) / 100;
  const baseNeigong = baseNeigongLevel(unit);
  const specialNeigong = unit.isMob ? 0 : level;
  const skillPct = (100 + (baseNeigong + specialNeigong) / 2) / 100;
  return Math.round(levelTerm * attrPct * skillPct);
}
function isAlive(unit) { return (unit.hp == null ? maxHp(unit) : unit.hp) > 0; }
function unitRow(index) { return index < 3 ? "前列" : "後列"; }

efender}心脈要害，天地萬古為之一寂。"],"血影滅魂針":["{attacker}氣機驟斂、指尖銀光化作恆河沙數殘影，一式[九針滅影無痕]悄無聲息，{weapon}直往{defender}命門激射而去，彷彿三千世界的殘影同時襲至。","{attacker}目中殺機一閃、周遭陰風貫穿九幽諸天，一式[萬影歸針一線]不留生機，{weapon}裹著森然寒意，天地間所有殘影盡數匯聚成這一針，往{defender}要害激射而去。","{attacker}氣息一沉、殺意化作滿天星辰墜落，一式[針落九幽無聲]如附影隨形，{weapon}似有三千大千世界的符咒同時纏繞，直取{defender}要害而去。","{attacker}周身寒氣驟聚、殺機化影遮蔽九霄，一式[影絕魂飛九天]勢不可擋，{weapon}如附骨之疽貫穿古今，直穿{defender}周身要穴，教殘影都為之震顫。","{attacker}氣機沸湧、殺意貫穿恆河沙數孤魂野路，一式[千針葬盡孤魂]不留餘地，{weapon}裹著滾滾陰煞之氣籠罩三千世界，朝{defender}周身要害激射而去。","{attacker}周身殺氣凝而不散、九霄為之變色、大千世界同時黯滅，一式[血影滅盡蒼穹]已至，{weapon}如萬千怨魂齊聚、化作籠罩三千世界的漫天血影，直穿{defender}心脈魂魄，教人魂飛魄散於天地之間。"],"軍弓訣":["{attacker}足尖輕點、腳步一橫，右手三指扣弦後撤，這一式「扣弦懸滿月」箭在弦上蓄勢欲發，鋒芒直指{defender}中門。","弓臂緩緩張滿，{attacker}眼神一凝，「覘準避鋒隙」已成，手指鬆放的剎那，箭矢破空直逼{defender}而去。","{attacker}側身避開視線遮擋，手腕輕轉間搭箭如飛，一式「卷羽藏鋒鏑」看似隨手一射，去勢卻快得驚人，直往{defender}撲去。","弓身微微下壓，{attacker}故意放緩呼吸掩人耳目，這一式「沉腕鎖敵蹤」實則暗中蓄力，待{defender}稍一鬆懈，箭矢已然離弦。","{attacker}猛然轉身變換角度，弓弦拉滿至滿月之形，一式「開弓貫朔漠」看準{defender}側翼破綻，箭去如風。","{attacker}雙腳前後開立、腰馬合一，弓臂與箭矢同時繃緊如弦上滿月，這一式「滿彀摧九關」蓄力已至極限，手指一鬆，箭矢便如奔雷般直搗{defender}要害。"],"破軍弓法":["{attacker}屏息一頓，箭尾忽然迸裂出點點雁羽虛光，這一式「裂雁羽」倏然貫出，直取{defender}肩頭削去。","{attacker}猿臂輕舒，弦上錚然一聲輕鳴，「引弦鳴」已然離弦，朝{defender}疾衝而去。","{attacker}氣息陡斂、指尖一鬆，一式「貫朔風」箭嘯如刀，捲起漫天沙塵，直撲{defender}面門而至。","箭羽驟然舒張如小旌招展，{attacker}這一式「卷旌箭」看似輕巧，勁力卻已暗中透體，往{defender}要害掠去。","{attacker}沉肩墜肘、弓身微彎如滿月，一式「沉弓勢」蓄勢待發，{weapon}驟然一震，朝{defender}當胸貫去。","{attacker}指尖一撥、弦音低鳴如戍樓更鼓，一式「鎮戍弦」已成，直教{defender}心頭一凜、不敢輕動。"],"護國九箭訣":["{attacker}長弓平舉，天際忽有九道破空之聲接連而起，殺氣暴漲間，「第一式破雲落雁」乍然貫出，箭勢裂雲而下，直取{defender}咽喉點去。","{attacker}臂如鐵鑄、弓滿如輪，「第二式驚鴻掠塞」隨之而至，長風自箭尾捲起，呼嘯聲中夾雜著千軍萬馬般的轟鳴，朝{defender}疾撲而去。","{attacker}仰身開弓、氣貫九霄，「第三式九霄貫日」使出，箭芒竟似衝破雲層直上，剎那間天光為之一暗，隨即化作一線寒芒，朝{defender}當面激射而至。","{attacker}氣機暴湧、指尖鬆放，「第四式萬里裂空」接連而至，箭勢所過之處空氣為之裂響，如千山萬壑齊聲崩裂，向{defender}周身席捲而來。","{attacker}周身弓氣澎湃，「第五式朔漠驚弦」已成，弦聲乍響，驚起漫天沙礫隨箭勢翻湧，宛如朔漠風暴驟然成形，直搗{defender}要害而去。","{attacker}氣沉丹田、萬箭歸一，「終式九箭震九垓」已成——九道箭芒於空中驟然匯聚，化作一線貫穿長空的寒光，震盪九垓，直取{defender}周身要害呼嘯落下！"],

// currentShanduoName：依角色門派模組查對應的shanduo鏈錨點名稱，再用findSubSkill()正確取得
// 「目前這條鏈實際裝備的招式名」——2026-09-23修正：原本寫死讀subSkills[1]，對3欄位模組
// （main/neigong/shanduo）剛好對，但血羅聖教兩個模組是4欄位（多一個dushu毒術欄位插在
// neigong前面：main/dushu/neigong/shanduo），shanduo其實在subSkills[2]，寫死[1]會抓成
// neigong的名稱、閃避敘事永遠查無entry。用MODULE_SHANDUO_ANCHOR＋findSubSkill()正確解析。
const MODULE_SHANDUO_ANCHOR = {
  "chunyang-sword":"逐光身法", "chunyang-array":"逐光身法",
  "wuxiang-staff":"渡雲身法", "wuxiang-fist":"渡雲身法",
  "yaowang-medicine":"懸壺身法",
  "xueluo-dagger":"紅羅夜影步", "xueluo-throw":"紅羅夜影步",
  "pojun-spear":"穿陣步", "pojun-bow":"穿陣步", "pojun-lance":"穿陣步", "pojun-rider":"穿陣步",
  "chuliuyun-blade":"樓行身法"
};
function currentShanduoName(character) {
  const anchor = MODULE_SHANDUO_ANCHOR[character.moduleId];
  if (!anchor) return null;
  const sub = findSubSkill(character, anchor);
  return sub ? sub.name : anchor;
}
function dodgeNarrative(defender, attacker) {
  const skill = currentShanduoName(defender); const lines = (skill && DODGE_FLAVOR[skill]) || [];
  if (!lines.length) return teamTag(attacker) + " " + nameSpan(attacker) + "攻擊 " + nameSpan(defender) + "，被閃過了！";
  const text = narrativePick(lines, attacker.id + defender.id + defender.hp);
  return text.replaceAll("{attacker}", nameSpan(attacker)).replaceAll("{defender}", nameSpan(defender))
    .replace(/\[([^\]]+)\]/g, (m, inner) => "<span style=\"color:var(" + identityColorVar(defender) + ")\">[" + inner + "]</span>");
}

function narrativePick(lines, key) {

  if (task.id === "saodang-1" && squad && STATE.playerCharacterId && getSquadMembers(squad).some(m => m.id === STATE.playerCharacterId) && !STATE.roster.some(r => r.id === TUSUSU_ID) && Math.random() < 0.3) {

}
// 逾期失敗（kill/collect型觸發次數用完仍未達標）：不是隊伍全滅，跟defeated分開一個狀態；
// 隊伍平安無事，已經打下來的戰鬥掉落物仍照常入庫，只是沒有任務獎勵可拿。
function failDispatchTask(dp, task) {
  dp.status = "failed";
  const squad = STATE.squads.find(x => x.id === dp.squadId);
  STATE.inventory.push(...dp.pendingLoot);
  const shortfall = task.goalType === "kill"
    ? "擊殺數不足（" + (dp.killCount || 0) + "/" + task.goalCount + "）"
    : "蒐集數不足（" + dp.pendingLoot.filter(x => x.name === task.targetItem).length + "/" + task.goalCount + "）";
  STATE.explorationLog.unshift({ timestamp: Date.now(), location: task.name, squad: squad ? squad.name : "未知隊伍", point: dp.progress, event: "fail", results: ["觸發次數已達上限，任務失敗：" + shortfall + "。隊伍平安帶回戰鬥拾取物，但沒有任務獎勵。"] });
  if (STATE.explorationLog.length > 50) STATE.explorationLog.length = 50;
}
function finishNonBattleDispatchPoint(dp, task, squad, point, event, log) {
  dp.progress++;
  STATE.explorationLog.unshift({ timestamp: Date.now(), location: task.name, squad: squad.name, point, event, results: log });
  if (STATE.explorationLog.length > 50) STATE.explorationLog.length = 50;
  if (dp.status === "active") checkDispatchGoal(dp, task);
  saveState(); render();
}
function advanceOneDispatch(dp) {
  if (dp.status !== "active" || dp.battle) return;
  const task = DISPATCH_TASKS.find(x => x.id === dp.taskId); const squad = STATE.squads.find(x => x.id === dp.squadId);
  if (!task || !squad) { removeDispatch(dp.squadId); saveState(); render(); return; }
  const event = dp.events[dp.progress]; const point = dp.progress + 1; const log = [];
  if (event === "quiet" || event === "loot") { log.push("第 " + point + " 點：一路平靜，沒有遇上阻礙。"); finishNonBattleDispatchPoint(dp, task, squad, point, event, log); return; }
  if (event === "rest") { getSquadMembers(squad).filter(isAlive).forEach(x => { x.hp = Math.min(maxHp(x), x.hp + Math.round(maxHp(x) * .3)); x.qi = Math.min(maxQi(x), x.qi + Math.round(maxQi(x) * .3)); }); log.push("第 " + point + " 點：找到落腳處，全隊回復 30% HP 與內力。 "); finishNonBattleDispatchPoint(dp, task, squad, point, event, log); return; }
  if (event === "battle") {
    const battleNumber = (dp.battleCount || 0) + 1; dp.battleCount = battleNumber;
    dp.battle = startDispatchBattle(task, battleNumber, dp.seed + point);
    saveState(); render();
    return;
  }
}
// 2026-09-24：可能同時有好幾支隊伍在派遣，每3秒tick要逐一推進每一支。
function advanceDispatch() { (STATE.dispatches || []).slice().forEach(advanceOneDispatch); }
function retreatDispatch(squadId) {
  if (!squadId) return;
  const dp = findDispatch(squadId);
  if (!dp) return;
  removeDispatch(squadId);
  rerollSingleDispatchTask(dp.taskId); // 主動撤退也算「任務結束」，一樣立刻釋出重骰
  saveState(); render();
}

/* =========================================================
   歷練結算（簡化版自動結算，作用對象是玩家建立的角色，不是楼主）
   ========================================================= */

/* =========================================================
   渲染：共用元件
   ========================================================= */

/* 貨幣：比照1.0「貨幣三級制」（2026-09-10定案）——金錠／銀兩／銅錢，
   **只存銅錢一種原子單位**，金銀比1:10、銀銅比1:1000，金錠純粹是顯示層換算。 */
const COPPER_PER_SILVER = 1000;
const SILVER_PER_GOLD = 10;
function formatMoney(copper) {
  const total = Math.max(0, Math.floor(copper || 0));
  const silverTotal = Math.floor(total / COPPER_PER_SILVER);
  const gold = Math.floor(silverTotal / SILVER_PER_GOLD);
  const silver = silverTotal % SILVER_PER_GOLD;
  const rest = total % COPPER_PER_SILVER;
  const parts = [];
  if (gold) parts.push(gold + "金");
  if (silver) parts.push(silver + "銀");
  if (rest || !parts.length) parts.push(rest + "銅");
  return parts.join("");
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(k => {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.startsWith("on")) e.addEventListener(k.substring(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
  }
  (children || []).forEach(c => {
    if (c == null) return;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

// bonus 有值時顯示「有效值（+加成）」，讓玩家看得出武學屬性加成貢獻了多少。
function statGrid(stats, bonus) {
  return el("div", { class: "stat-grid" }, STAT_KEYS.map(k =>
    el("div", { class: "stat-item" }, [
      el("span", { class: "k" }, [STAT_LABELS[k]]),
      el("span", { class: "v" }, [String(stats[k]) + (bonus && bonus[k] ? "（+" + bonus[k] + "）" : "")])
    ])
  ));
}

// 頂欄RP/錢財數字捲動（2026-09-24新增）：只有數值真的變動過才會播放捲動效果，第一次
// 進遊戲（lastRendered還是null）不捲動、直接顯示，避免開場就跑一次沒意義的動畫。
let lastRenderedRP = null;
let lastRenderedGP = null;
function tweenTopbarValue(spanEl, fromVal, toVal, formatFn, duration) {
  const start = performance.now();
  function step(now) {
    if (!spanEl.isConnected) return; // 元素已經被下一次重畫換掉，停止這輪動畫
    const t = Math.min(1, (now - start) / duration);
    spanEl.textContent = formatFn(Math.round(fromVal + (toVal - fromVal) * t));
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// 物語分頁教學章節：在楚流雲被拉進隊伍之前，每次進「物語」都會顯示他的引導對白
// （jun 2026-09-22裁定：不放在據點，放物語，且不設「只顯示一次」的旗標，每次進來都講，
// 直到玩家完成「拉他入隊」這個動作，教學章節才算過去，把舞台讓給後續章節）。
// 地點解鎖的對話事件優先權比教學對白高——攻略成功會自動轉導到這裡（見completeLocation）。
// 物語對話卡的肖像欄（2026-09-24新增，jun要求增加畫面豐富度）：畫面左側肖像圖＋
// 肖像下方標註名字，跟現有roster畫面的.portrait-slot共用同一套視覺語言（虛線框佔位）。
// title可能是單一角色名（"洛軒"）或多角色用「・」分隔（"楚流雲・顧曉陽"），後者逐一
// 顯示多張肖像，垂直堆疊在同一欄。
function storyPortraitColumn(title) {
  const names = String(title || "").split("・").filter(Boolean);
  if (!names.length) return null;
  return el("div", { style:"flex-shrink:0; display:flex; flex-direction:column; gap:10px;" }, names.map(name => {
    const portrait = name === "楚流雲" ? PORTRAIT_CATALOG["楚流雲"] : portraitFor(name);
    return el("div", { style:"width:96px; text-align:center;" }, [
      portrait
        ? el("div", { class:"portrait-slot", style:"width:96px;height:96px;" }, [el("img", { src:portrait.head, style:"width:100%;height:100%;object-fit:cover;border-radius:6px;display:block;" })])
        : el("div", { class:"portrait-slot", style:"width:96px;height:96px;" }, ["頭像"]),
      el("div", { style:"margin-top:6px;font-size:13px;color:var(--text);font-weight:bold;" }, [name])
    ]);
  }));
}
// 帶肖像欄的物語對話卡：肖像＋名字在左，對話文字在右（card-main），跟roster畫面
// 的.card-row／.portrait-slot共用同一套版型。
function storyCardWithPortrait(title, html) {
  return el("div", { class:"card selected" }, [
    el("div", { class:"card-row" }, [
      storyPortraitColumn(title),
      el("div", { class:"card-main" }, [el("div", { class:"card-desc", html })])
    ])
  ]);
}

      el("option", { value: "" }, ["選擇門派"]), ...SECTS.map(s => el("option", { value: s }, [s]))
    ]);

    wrap.appendChild(sectSelect);

        el("option", { value: "" }, ["選擇「" + draft.sect + "」分支"]), ...MODULE_DEFS.filter(m => m.sect === draft.sect).map(m => el("option", { value: m.id }, [m.name + "・" + m.ai]))

  STATE.squads.forEach(s => { s.memberIds = s.memberIds.filter(id => id !== character.id); });
  const target = STATE.squads.find(s => s.id === squadId);
  if (target && target.memberIds.length < SQUAD_CAPACITY) { target.memberIds.push(character.id); character.squadId = target.id; }

function removeFromSquad(character) {
  if (character.isPlayerCharacter) return; // 玩家分身固定第1隊，不可移出（jun 2026-09-21定案）

function reorderSquadMember(squadId, memberId, offset) {
  const squad = STATE.squads.find(s => s.id === squadId);
  if (!squad || !isSquadUnlocked(squadId)) return;
  const from = squad.memberIds.indexOf(memberId), to = from + offset;
  if (from < 0 || to < 0 || to >= squad.memberIds.length) return;
  [squad.memberIds[from], squad.memberIds[to]] = [squad.memberIds[to], squad.memberIds[from]];
  saveState(); render();
}

      ]),

    ]);

  });
  const selectedTask = DISPATCH_TASKS.find(t => t.id === STATE.ui.dispatchSelectedTaskId);
  if (selectedTask && readySquads.some(s => s.id === STATE.ui.selectedDispatchSquadId)) {

      ...members.map((member, index) => el("div", { class: "row-between", style: "margin-top:6px;" }, [

      ])),

/* 買賣機制（2026-09-22）：錢財以銅錢為原子單位；商店賣裝備給玩家，玩家可把庫房裡的
   裝備／素材賣回換錢（賣價＝售價一半）。unique道具（例如禁鞭）不販售也不收購。 */
function buyItem(itemId) {
  const item = catalogItem(itemId);
  if (!item || item.unique || !item.price) return;
  if (STATE.lord.gp < item.price) return;
  STATE.lord.gp -= item.price;
  STATE.inventory.push({ kind:"equipment", itemId:item.id, name:item.name });
  saveState(); render();
}
function sellInventoryItem(index) {
  const entry = STATE.inventory[index];
  if (!entry) return;
  if (entry.kind === "equipment") {
    const item = catalogItem(entry.itemId);
    if (item && item.unique) return; // 專屬神兵不可賣
  }
  STATE.lord.gp += sellPriceOf(entry);
  STATE.inventory.splice(index, 1);
  saveState(); render();
}
// 一次賣掉同名的整疊道具（2026-09-23裁定新增：素材常常一堆同名的，一件一件賣太累）。
// 跟單件賣出一樣，專屬神兵不可賣；由後往前刪除避免index位移。
function sellAllInventoryItem(name) {
  let total = 0;
  for (let i = STATE.inventory.length - 1; i >= 0; i--) {
    const entry = STATE.inventory[i];
    if (!entry || entry.name !== name) continue;
    if (entry.kind === "equipment") {
      const item = catalogItem(entry.itemId);
      if (item && item.unique) continue;
    }
    total += sellPriceOf(entry);
    STATE.inventory.splice(i, 1);
  }
  if (!total) return;
  STATE.lord.gp += total;
  saveState(); render();
}

function screenShop() {
  const content = document.getElementById("content");
  content.innerHTML = "";
  const lord = STATE.lord;
  const subTab = STATE.ui.shopSubTab || "storage";

  content.appendChild(el("div", { class: "screen-title" }, [
    el("span", { class: "tag" }, ["商店"]),
    el("h1", null, ["樓中庫房"]),
    el("div", { style: "margin-left:auto; display:flex; gap:6px;" }, [
      el("button", { class: subTab === "storage" ? "btn" : "btn secondary", style: "width:auto; padding:6px 14px; font-size:12px;", onclick: () => { STATE.ui.shopSubTab = "storage"; saveState(); render(); } }, ["庫房"]),
      el("button", { class: subTab === "buy" ? "btn" : "btn secondary", style: "width:auto; padding:6px 14px; font-size:12px;", onclick: () => { STATE.ui.shopSubTab = "buy"; saveState(); render(); } }, ["採買"])
    ])
  ]));

  content.appendChild(el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [el("span", { class:"name" }, ["樓中錢財"]), el("span", { class:"gp-val" }, [formatMoney(lord.gp)])]),
    el("div", { class: "card-desc" }, [subTab === "buy"
      ? "採買的裝備會直接入庫，再到人物詳情頁挑來穿戴。"
      : "歷練帶回的物資存放於此。可裝備道具能穿戴，任何道具都能賣出換錢（賣價為售價的一半）。"])
  ]));

  // 部位篩選（庫房／採買共用同一組按鈕）：全部／頭／手／身體／足／飾品／素材
  // 「素材」是2026-09-23新增：只篩選素材類道具，不含任何裝備部位。
  const currentFilter = STATE.ui.shopSlotFilter || "全部";
  content.appendChild(el("div", { style:"display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;" },
    ["全部", ...EQUIPMENT_SLOTS, "素材"].map(slot => el("button", {
      class: currentFilter === slot ? "btn" : "btn secondary", style:"width:auto; padding:5px 10px; font-size:12px;",
      onclick: () => { STATE.ui.shopSlotFilter = slot; if (slot !== "手") STATE.ui.shopWeaponTypeFilter = "全部"; saveState(); render(); }
    }, [slot === "手" ? "武器" : slot]))
  ));
  // 武器二級分類（依武器類別，只有選到「武器」部位時才顯示）
  const weaponTypeFilter = STATE.ui.shopWeaponTypeFilter || "全部";
  if (currentFilter === "手") {
    content.appendChild(el("div", { style:"display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;" },
      ["全部", ...Object.keys(BASE_SKILLS)].map(wt => el("button", {
        class: weaponTypeFilter === wt ? "btn" : "btn secondary", style:"width:auto; padding:4px 9px; font-size:11px;",
        onclick: () => { STATE.ui.shopWeaponTypeFilter = wt; saveState(); render(); }
      }, [wt === "全部" ? "全部" : BASE_SKILLS[wt].label]))
    ));
  }
  function applyWeaponTypeFilter(items) {
    if (currentFilter !== "手" || weaponTypeFilter === "全部") return items;
    return items.filter(item => item.weaponType === weaponTypeFilter);
  }

  if (subTab === "buy") {
    const max = shopMaxTier();
    let forSale = EQUIPMENT_CATALOG.filter(item => !item.unique && item.price > 0 && (item.tier || 1) <= max);
    if (currentFilter !== "全部") forSale = forSale.filter(item => item.slot === currentFilter);
    forSale = applyWeaponTypeFilter(forSale);
    content.appendChild(el("div", { class:"card-desc" }, ["目前地點階級解鎖至第 " + max + " 階，商店只販賣同階以下的武器防具。"]));
    if (!forSale.length) content.appendChild(el("div", { class:"empty-hint" }, ["這個篩選條件下暫無商品。"]));
    EQUIPMENT_SLOTS.forEach(slot => {
      const items = forSale.filter(item => item.slot === slot);
      if (!items.length) return;
      content.appendChild(el("div", { class: "section-label" }, [slot === "手" ? "武器" : slot]));
      content.appendChild(el("div", { class: "card" }, items.map(item => {
        const spec = item.atk ? "攻擊+" + item.atk : item.def ? "防禦+" + item.def : "";
        const btn = el("button", { class:"btn secondary", style:"width:auto; padding:6px 14px; font-size:12px;", onclick:() => buyItem(item.id) }, ["買入 " + formatMoney(item.price)]);
        if (lord.gp < item.price) btn.disabled = true;
        return el("div", { class:"row-between", style:"margin-top:6px;" }, [
          el("span", null, [item.name + (spec ? "（" + spec + "）" : "")]), btn
        ]);
      })));
    });
    return;
  }

  // 庫房：依名稱合併顯示，賣出時一次賣一件（賣掉該名稱中的第一件）；數量大於1時
  // 額外提供「全部賣出」一次清空整疊（2026-09-23新增：素材常常一堆同名，一件件賣太累）。
  const groupRows = list => {
    const names = [];
    list.forEach(x => { if (!names.includes(x.entry.name)) names.push(x.entry.name); });
    return names.map(name => {
      const group = list.filter(x => x.entry.name === name);
      const sample = group[0];
      const item = sample.entry.kind === "equipment" ? catalogItem(sample.entry.itemId) : null;
      const spec = item ? (item.atk ? "攻擊+" + item.atk : item.def ? "防禦+" + item.def : "") : "";
      const price = sellPriceOf(sample.entry);
      const sellable = !(item && item.unique);
      const controls = [el("span", { class:"gp-val" }, ["×" + group.length])];
      if (sellable) {
        controls.push(el("button", { class:"btn secondary", style:"width:auto; padding:6px 12px; font-size:12px;", onclick:() => sellInventoryItem(sample.index) }, ["賣出 " + formatMoney(price)]));
        if (group.length > 1) controls.push(el("button", { class:"btn secondary", style:"width:auto; padding:6px 12px; font-size:12px;", onclick:() => sellAllInventoryItem(name) }, ["全部賣出 " + formatMoney(price * group.length)]));
      }
      return el("div", { class:"row-between", style:"margin-top:6px;" }, [
        el("span", null, [name + (spec ? "（" + spec + "）" : "")]),
        el("span", { style:"display:flex; gap:8px; align-items:center; flex-wrap:wrap;" }, controls)
      ]);
    });
  };
  const indexed = STATE.inventory.map((entry, index) => ({ entry, index })).filter(x => x.entry);
  let equipmentRows = indexed.filter(x => x.entry.kind === "equipment");
  let materialRows = indexed.filter(x => x.entry.kind !== "equipment");
  if (currentFilter === "素材") {
    equipmentRows = []; // 選「素材」時只看素材，不顯示任何裝備部位
  } else if (currentFilter !== "全部") {
    equipmentRows = equipmentRows.filter(x => { const item = catalogItem(x.entry.itemId); return item && item.slot === currentFilter; });
    materialRows = []; // 選特定裝備部位時不顯示素材
  }
  if (currentFilter === "手" && weaponTypeFilter !== "全部") {
    equipmentRows = equipmentRows.filter(x => { const item = catalogItem(x.entry.itemId); return item && item.weaponType === weaponTypeFilter; });
  }

  if (currentFilter !== "素材") {
    content.appendChild(el("div", { class: "section-label" }, ["可裝備道具（" + equipmentRows.length + "）"]));
    if (!equipmentRows.length) content.appendChild(el("div", { class: "empty-hint" }, ["這個篩選條件下尚無可裝備道具。擊敗人形敵人（11級以上）有機會掉落，也可到「採買」購買。"]));
    else content.appendChild(el("div", { class: "card" }, groupRows(equipmentRows)));
  }

  if (currentFilter === "全部" || currentFilter === "素材") {
    content.appendChild(el("div", { class: "section-label" }, ["素材（" + materialRows.length + "）"]));
    if (!materialRows.length) content.appendChild(el("div", { class: "empty-hint" }, ["尚無帶回素材。完成一趟歷練後，暫存拾取物才會入庫。"]));
    else content.appendChild(el("div", { class: "card" }, groupRows(materialRows)));
  }
}

   ========================================================= */

function render() {
  // 第一次開局必須先建立玩家角色分身，才能進入據點（jun 2026-09-21定案）
  if (STATE && !STATE.playerCharacterId && STATE.ui.screen !== "story" && STATE.ui.screen !== "player-create") {
    STATE.ui.screen = "player-create";
  }
  if (STATE && STATE.ui && STATE.ui.screen === "main") recoverRestingCharacters();
  const screen = STATE.ui.screen;

  if (screen === "story") {
    document.getElementById("topbar").style.display = "none";
    renderNoticebar("冒険者 募集中");
    screenStory();
    document.getElementById("navbar").style.display = "none";
    return;
  }

  if (screen === "recruit-build" || screen === "player-create") {
    document.getElementById("topbar").style.display = "none";
    renderNoticebar(null);
    screenRecruitBuild();
    document.getElementById("navbar").style.display = "none";
    return;
  }
  if (screen === "character-detail") {
    document.getElementById("topbar").style.display = "none";
    renderNoticebar(null);
    screenCharacterDetail();
    document.getElementById("navbar").style.display = "none";
    return;
  }

  // screen === "main"
  renderTopbar();
  renderNoticebar(null);
  const tab = STATE.ui.tab;
  if (tab === "story") screenStory();
  else if (tab === "guild") screenGuild();
  else if (tab === "dungeon") screenDungeon();
  else if (tab === "shop") screenShop();
  else if (tab === "log") screenLog();
  renderNavbar();
}

/* =========================================================
   啟動
   ========================================================= */

// 清掉早期單人原型(v1/v2)遺留、跟現行13分支系統不相容的角色資料，避免點進去就當掉
// （見補充第十三輪）。同步移出所有隊伍的memberIds，避免留下懸空引用。
function sanitizeRoster() {
  if (!STATE || !Array.isArray(STATE.roster)) return;
  const validIds = new Set();
  STATE.roster = STATE.roster.filter(r => {
    const ok = Boolean(r.isPlayerCharacter) || Boolean(MODULE_SKILLS[r.moduleId]);
    if (ok) validIds.add(r.id); else console.warn("移除不相容的舊版角色資料：", r.name, r.moduleId);
    return ok;
  });
  (STATE.squads || []).forEach(s => { s.memberIds = (s.memberIds || []).filter(id => validIds.has(id)); });
}
// 一次性清除：招募功能已隱藏，2026-09-23 jun裁定把之前用招募流程建立的角色全部清掉，
// 避免跟具名夥伴NPC（例如顧曉陽，剛好跟舊測試角色同名）重複存在。只留玩家分身跟正式
// 具名夥伴；用STATE.genericRecruitsPurged旗標確保只執行一次，不影響招募功能之後重新開放。
const AUTHORED_COMPANION_IDS = [CHULIUYUN_ID, GUXIAOYANG_ID, LUOXUAN_ID, QINXI_ID, MIAOQING_ID, LIYU_ID, TUSUSU_ID, LUYUAN_ID, LUYAO_ID];
function purgeGenericRecruits() {
  if (STATE.genericRecruitsPurged) return;
  const keepIds = new Set([STATE.playerCharacterId, ...AUTHORED_COMPANION_IDS].filter(Boolean));
  const removedIds = new Set(STATE.roster.filter(r => !keepIds.has(r.id)).map(r => r.id));
  STATE.roster = STATE.roster.filter(r => keepIds.has(r.id));
  STATE.squads.forEach(s => { s.memberIds = s.memberIds.filter(id => !removedIds.has(id)); });
  STATE.genericRecruitsPurged = true;
}
function init() {
  STATE = loadState();
  ensureDispatchRefresh();
  sanitizeRoster();
  normalizeInventory();
  purgeGenericRecruits();
  ensureGuideCompanion(); // 補齊舊存檔（玩家建角時這個機制還不存在的情況）
  // 補救：地點解鎖事件現在會一直持續顯示、直到下一個事件把它取代（不再有「繼續」
  // 手動關閉），所以只要曾經觸發過就不會是falsy——用這個特性判斷「存檔是不是在這個
  // 機制真正做完整以前就已經解鎖過地點」，把對應的事件（跟事件綁定的夥伴NPC）補回去。
  // 🔴不能只處理「最新解鎖的地點」——存檔如果一次跳過好幾個地點的事件，中間那些地點
  // 綁的夥伴NPC也要一併補齊，不能因為只看最新一個而漏掉。
  const LOCATION_COMPANION_ENSURERS = { meilin: ensureGuxiaoyangCompanion, huqiu: ensureLuoxuanCompanion, heifengling: ensureWuxinCompanion, funiushan: ensureYeruochenCompanion, zhulin: ensureNiehanCompanion };
  if (STATE.playerCharacterId) {
    (STATE.unlockedLocations || ["xihu"]).forEach(id => { if (LOCATION_COMPANION_ENSURERS[id]) LOCATION_COMPANION_ENSURERS[id](); });
  }
  if (STATE.playerCharacterId && !STATE.pendingStoryEvent) {
    const ids = STATE.unlockedLocations || ["xihu"];
    const latestEventId = ids.length > 1 ? ids[ids.length - 1] : null; // 西湖本身沒有解鎖事件
    if (latestEventId) {
      STATE.pendingStoryEvent = latestEventId;
      if (STATE.ui.screen === "main") STATE.ui.tab = "story"; // 立即轉導，不用等玩家自己點過去
    }
  }
  render();
}

init();

// 每30秒重繪一次，讓RP恢復倒數與畫面保持同步（僅在main畫面時有意義）；同時檢查派遣任務
// 是否該刷新了（2026-09-24新增），這樣就算玩家沒開著江湖分頁，60分鐘一到還是會準時重骰。
setInterval(() => {
  if (STATE && STATE.ui.screen === "main") {
    ensureDispatchRefresh();
    render();
  }
}, 30000);

// 派遣刷新倒數每秒更新（2026-09-24新增，jun要求秒數要即時跳動，方案B：只改倒數文字本身，
// 不整頁重繪，避免每秒都砍掉重建畫面的效能負擔）。真正觸發刷新（每60分鐘一次）時才呼叫
// 一次完整render()，讓重骰後的任務內容立刻反映在畫面上；平常每秒只是單純patch文字內容。
setInterval(() => {
  if (!STATE || STATE.ui.screen !== "main") return;
  if (ensureDispatchRefresh()) { render(); return; }
  const el = document.getElementById("dispatch-refresh-countdown");
  if (el) el.textContent = dispatchRefreshCountdownText();
}, 1000);

// 歷練自動進行：每3秒推進一個觸發點，玩家不能手動點下一步，只能主動撤退（jun 2026-09-21定案）。
// 戰鬥進行中這個timer會自動略過（advanceOneExpedition內部guard），改由下面的逐拍timer接手。
// 2026-09-24：可能同時有好幾支隊伍在歷練，guard/迴圈都移進advanceExpedition()內部處理，
// 這裡不用再檢查單一個STATE.expedition。
setInterval(() => {
  if (STATE) advanceExpedition();
}, 3000);

// 戰鬥逐拍推進：每1.5秒推進一個行動者的回合，比照1.0行動節奏（jun 2026-09-22定案），
// 讓玩家能一句一句看戰報跑出來，不是整場戰鬥瞬間跑完。
setInterval(() => {
  if (STATE) advanceBattleTick();
}, 1500);

// 派遣（任務系統，2026-09-23新增）：跟歷練的兩個計時器完全對稱，各自獨立推進，
